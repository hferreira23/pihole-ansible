---
- name: Manage Pi-hole allow lists
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    hferreira23.pihole.allow_list:
      url: "{{ pihole_url }}"
      password: "{{ pihole_password }}"
      validate_certs: "{{ pihole_validate_certs | default(true) }}"
      ca_path: "{{ pihole_ca_path | default(omit) }}"
  tasks:
    - name: Add, update, and remove allow lists in one batch
      hferreira23.pihole.allow_list:
        update_gravity: true
        gravity_timeout: 300  # Optional; defaults to 60 seconds for gravity only.
        lists:
          # Reserved example.com placeholder: replace with a real list URL.
          - address: "https://example.com/allowlist.txt"
            state: present
            comment: Managed allow list
            groups: [0]  # An unquoted integer ID, not the string "0".
          # Omission preserves existing memberships, even when a comment changes.
          - address: "https://example.com/existing-allowlist.txt"
            state: present
            comment: Updated description
          # Empty groups explicitly clears current memberships.
          - address: "https://example.com/limited-allowlist.txt"
            state: present
            groups: []
            enabled: false
          - address: "https://example.com/retired-allowlist.txt"
            state: absent
      register: allow_list_result

    - name: Show per-list results
      ansible.builtin.debug:
        var: allow_list_result
