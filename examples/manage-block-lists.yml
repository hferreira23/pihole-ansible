---
- name: Manage Pi-hole block lists
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    hferreira23.pihole.block_list:
      url: "{{ pihole_url }}"
      password: "{{ pihole_password }}"
      validate_certs: "{{ pihole_validate_certs | default(true) }}"
      ca_path: "{{ pihole_ca_path | default(omit) }}"
  tasks:
    - name: Add, update, and remove block lists in one batch
      hferreira23.pihole.block_list:
        update_gravity: true
        lists:
          # Reserved example.com placeholder: replace with a real list URL.
          - address: "https://example.com/blocklist.txt"
            state: present
            comment: Managed block list
            groups: [Default]
            enabled: true
          # Explicit [] removes all memberships; disabled lists stay disabled.
          - address: "https://example.com/disabled-blocklist.txt"
            state: present
            groups: []
            enabled: false
          # Omitted groups preserve existing memberships during field updates.
          - address: "https://example.com/existing-blocklist.txt"
            state: present
            comment: Updated description
          - address: "https://example.com/retired-blocklist.txt"
            state: absent
      register: block_list_result

    - name: Show per-list results
      ansible.builtin.debug:
        var: block_list_result
