---
- name: Manage individual Pi-hole whitelist and blacklist entries
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    hferreira23.pihole.domains:
      url: "{{ pihole_url }}"
      password: "{{ pihole_password }}"
      validate_certs: "{{ pihole_validate_certs | default(true) }}"
      ca_path: "{{ pihole_ca_path | default(omit) }}"
  tasks:
    - name: Add or update exact and regex domains and remove an obsolete entry
      hferreira23.pihole.domains:
        domains:
          - domain: allowed.example.com
            type: allow
            comment: Required service
            groups: [Default]
            enabled: true
          - domain: ads.example.com
            type: deny
            groups: [0]
          - domain: '(^|\.)tracking\.example\.com$'
            type: deny
            kind: regex
            groups: [0]
          - domain: '(^|\.)trusted\.example\.com$'
            type: allow
            kind: regex
            groups: [0]
          # This explicitly removes only this domain/type/kind identity.
          - domain: obsolete.example.com
            type: deny
            state: absent
      register: domain_result

    - name: Show domain reconciliation results
      ansible.builtin.debug:
        var: domain_result
